name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Build first: the workspace packages (agent, css, permissive) type-check
      # and test against the core's published dist, as an outside consumer would.
      - name: Build
        run: npm run build
      - name: Type-check (src + tests + examples + packages)
        run: npm run typecheck:all
      - name: Test
        run: npm test

  package:
    name: Published package (pack, install, import, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Installs the packed tarball into a throwaway project: every subpath
      # must import and a golden-path file must type-check strictly.
      - run: npm run verify:package

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Builds the core, the permissive package and the three example apps,
      # then serves them and runs browser-tests/.
      - name: Browser tests
        run: npm run test:browser

  bench:
    name: Performance benchmarks (tracked, non-blocking)
    runs-on: ubuntu-latest
    # Perf thresholds on shared CI runners are noise-prone, so this job tracks
    # the hot-path benchmarks as an uploaded artifact rather than hard-failing
    # on a regression. Promote to a gate once a stable runner + baseline exist
    # (see docs/CURRENT_STATUS_IN_REDESIGN_PLAN.md, PR3).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run benchmarks
        run: npm run bench:ci
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: warn
